<div class="container position-relative">

    <div class="row">


        <section class="hero" aria-labelledby="title">
            <span class="news-title selectedtab-head-text" id="title">News &amp; <span
                    class="news-media">Media</span></span>
            <div class="switcher legal-subhead">
                <a [ngClass]="{'active': category === 'news'}" (click)="changeSection('news')">ONLINE MEDIA</a>
                <a (click)="changeSection('videos')" [ngClass]="{'active': category === 'videos'}"
                    aria-disabled="true">VIDEOS</a>
            </div>
            <nav class="languages text-common" aria-label="Languages">
                <a [ngClass]="{'active': language === 'English'}"
                    (click)="filterByLanguage('English')">English</a><i></i>
                <a [ngClass]="{'active': language === 'Marathi'}"
                    (click)="filterByLanguage('Marathi')">Marathi</a><i></i>
                <a [ngClass]="{'active': language === 'Hindi'}" (click)="filterByLanguage('Hindi')">Hindi</a><i></i>
                <a [ngClass]="{'active': language === 'Kannada'}"
                    (click)="filterByLanguage('Kannada')">Kannada</a><i></i>
                <a [ngClass]="{'active': language === 'Gujarati'}"
                    (click)="filterByLanguage('Gujarati')">Gujarati</a><i></i>
                <a [ngClass]="{'active': language === 'Malayalam'}"
                    (click)="filterByLanguage('Malayalam')">Malayalam</a><i></i>
                <a [ngClass]="{'active': language === 'Punjabi'}" (click)="filterByLanguage('Punjabi')">Punjabi</a>
            </nav>
        </section>


        <div *ngIf="category === 'news'">
            <section #newsGrid class="news-grid" id="news" aria-label="Online media stories" data-api="/api/news">
                <ng-container *ngFor="let news of displayedNews">
                    <article class="card">
                        <img [src]="news.imageUrl" [alt]="news.title" (click)="openArticlePage(news)" loading="lazy">
                        <div class="card-content">
                            <div class="meta consent-text" (click)="openArticlePage(news)">
                                <span>{{news.publication}}</span><span>{{ formatDate(news.date) }}</span>
                            </div>
                            <span class="headline selectedtab-label"
                                (click)="openArticlePage(news)">{{news.title}}</span>
                            <p class="sub-heading consent-text" (click)="openArticlePage(news)">
                                {{news.smallDescription}}</p>
                            <div class="border-line"></div>
                            <div class="stats">
                                <span><img src="assets/images/eye.svg" alt="">{{ news.views || 0 }}</span>
                                <span>

                                    <button type="button" class="card-like-btn" [class.liked]="isLiked(news.uid)"
                                        [disabled]="isLiked(news.uid)"
                                        [attr.aria-label]="isLiked(news.uid) ? 'Already liked' : 'Like this news'"
                                        (click)="likeArticle(news, $event)">

                                        <img src="assets/images/like.svg" alt="">

                                        {{ news.likes || 0 }}
                                    </button> </span>
                                <button type="button" (click)="shareStory(news)"><img src="assets/images/share-1.svg"
                                        alt="">Share</button>
                            </div>
                        </div>
                    </article>
                </ng-container>

            </section>
            <div class="loadmore-div mt-2">
                <button *ngIf="displayedNews.length < newsList.length" class="loadmore-div load-more legal-subhead"
                    type="button" (click)="loadMore()">

                    Load More
                </button>
            </div>
        </div>

        <div *ngIf="category === 'videos'">


            <section #videoGrid class="video-grid" id="video" aria-label="Online media stories">
                <ng-container *ngFor="let news of videoList; let i = index">

                    <article class="video-card" (mouseenter)="hoveredVideo = i" (mouseleave)="hoveredVideo = -1">
                        <div class="video-media">
                            <div class="video-wrapper" *ngIf="hoveredVideo !== i" (click)="openArticlePage(news)">
                                <img [src]="getYouTubeThumbnail(news.videoUrl)" class="youtube-thumbnail"
                                    alt="Video thumbnail" loading="lazy">

                                <div class="play-button">
                                    <svg xmlns="http://www.w3.org/2000/svg" 
                                        fill="none">
                                        <path
                                            d="M5.66699 17V11.9567C5.66699 5.69499 10.1012 3.13083 15.527 6.26166L19.9045 8.78333L24.282 11.305C29.7078 14.4358 29.7078 19.5642 24.282 22.695L19.9045 25.2167L15.527 27.7383C10.1012 30.8692 5.66699 28.305 5.66699 22.0433L5.66699 17Z"
                                            stroke="#F4F6FF" stroke-width="2.25" stroke-miterlimit="10"
                                            stroke-linecap="round" stroke-linejoin="round" />
                                    </svg>
                                </div>
                            </div>
                            <div class="youtube-player-container" *ngIf="hoveredVideo === i">
                                <youtube-player  class="youtube-player" #player
                                    [videoId]="getYouTubeVideoId(news.videoUrl)" [playerVars]="{
                            autoplay: 1,
                            controls: 0,
                            mute: 1,
                            rel: 0,
                            playsinline: 1
                        }">
                                </youtube-player>
                            </div>
                        </div>

                        <div class="card-content">
                            <div class="meta consent-text" (click)="openArticlePage(news)">
                                <span>{{ news.publication }}</span>
                                <span>
                                    {{ formatDate(news.date) }}
                                </span>
                            </div>
                            <span class="headline video-headline selectedtab-label video-headline"
                                (click)="openArticlePage(news)">
                                {{ news.title }}
                            </span>
                            <div class="border-line"></div>
                            <div class="stats">
                                <span>
                                    <img src="assets/images/eye.svg" alt="">
                                    {{news.views || 0}}
                                </span>
                                <span>
                                    <!--    <img src="assets/images/like.svg" alt="">
                                    {{news.likes || 0}}-->

                                    <button type="button" class="card-like-btn" [class.liked]="isLiked(news.uid)"
                                        [disabled]="isLiked(news.uid)"
                                        [attr.aria-label]="isLiked(news.uid) ? 'Already liked' : 'Like this video'"
                                        (click)="likeArticle(news, $event)">

                                        <img src="assets/images/like.svg" alt="">

                                        {{ news.likes || 0 }}
                                    </button></span>

                                <button type="button" (click)="shareStory(news)">
                                    <img src="assets/images/share-1.svg" alt="">
                                    Share
                                </button>
                            </div>
                        </div>
                    </article>
                </ng-container>
            </section>

            <div class="loadmore-div mt-3">
                <button *ngIf="videoList.length < totalVideos.length" class="loadmore-div load-more legal-subhead"
                    type="button" (click)="loadMore()">

                    Load More
                </button>
            </div>
        </div>

    </div>
</div>
