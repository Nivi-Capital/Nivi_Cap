<div class="coming-soon-page">

    <!-- Decorative background elements -->
    <div class="decorations" aria-hidden="true">
        <span class="decoration triangle"><img src="assets/images/triangle.svg" alt=""></span>
        <span class="decoration pink-dot"><img src="assets/images/pink-dot.svg" alt=""></span>
        <span class="decoration hexagon"><img src="assets/images/hexagon.svg" alt=""></span>
        <span class="decoration yellow-arc"><img src="assets/images/yellow-arc.svg" alt=""></span>
        <span class="decoration zigzag"><img src="assets/images/zigzag.svg" alt=""></span>
        <span class="decoration blue-square"><img src="assets/images/blue-square.svg" alt=""></span>
        <span class="decoration red-circle"><img src="assets/images/red-circle.svg" alt=""></span>
    </div>

    <!-- Main content -->
    <main class="coming-soon-content">

        <div class="heading-section">
            <span class="heading-title">We are coming soon!!</span>
            <p class="heading-subtitle">Stay tuned for something amazing</p>
        </div>

        <!-- Illustration -->
        <div class="illustration">
            <img src="assets/images/news-coming-soon.svg" alt="">
        </div>

        <!-- Social -->
        <div class="social-section">
            <p>
                Stay in the loop - follow us on social Media.
            </p>

            <div class="social-icons">

                <a href="https://www.linkedin.com/company/nivicapital/" class="social-icon linkedin" target="_blank"><img src="assets/images/linkedin.svg" alt=""></a>
                <a href="https://www.facebook.com/profile.php?id=61583499338803" class="social-icon facebook"
                target="_blank"><img src="assets/images/facebook.svg" alt=""></a>
                <a href="https://x.com/nivicapital" class="social-icon twitter" target="_blank"><img src="assets/images/twitter.svg" alt=""></a>
                <a href="https://www.instagram.com/nivicapital?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=="
                class="social-icon instagram" target="_blank"><img src="assets/images/instagram.svg" alt=""></a>

            </div>
        </div>

    </main>
</div>
